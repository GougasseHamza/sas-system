schema_version = 1
id = "onlychess"
name = "SAS 2025 OnlyChess remote rehearsal"
root = "../../../lab/onlychess/service-source"
tags = ["sas-2025", "web", "crypto", "remote-lab"]

[targets]
hosts = ["147.182.179.38"]

[context]
revision = "sas2025-cbbc937"
service_url = "http://147.182.179.38:4000"
attack_data_url = "http://147.182.179.38:8088/api/client/attack_data"
exploit_contract = "Provide exploit.py accepting the target IP as argv[1]; print recovered flags matching [A-Z0-9]{31}= to stdout. SAS_ATTACK_DATA_URL and SAS_SERVICE_URL are also supplied during verification."

[cell]
workers = 10
provider_instances = []
offense_enabled = true

[hooks.health]
argv = ["curl", "--fail", "--silent", "--show-error", "--max-time", "5", "--output", "/dev/null", "http://147.182.179.38:4000/open-invites"]
timeout_seconds = 8

[hooks.checker]
argv = ["uv", "run", "--no-sync", "python", "checker_roundtrip.py", "--base-url", "http://147.182.179.38:4000", "--wait-seconds", "0.5"]
cwd = ".."
timeout_seconds = 45

[hooks.integrity]
argv = ["python3", "-c", "import requests; value=requests.get('http://147.182.179.38:8088/api/state',timeout=5).json(); assert value['service_status']=='UP', value"]
timeout_seconds = 8

[hooks.verify_exploit]
argv = ["uv", "run", "--no-sync", "python", "verify_remote_exploit.py", "--candidate-root", "{candidate_root}", "--host", "147.182.179.38"]
cwd = ".."
timeout_seconds = 120

[hooks.verify_patch]
argv = ["uv", "run", "--no-sync", "python", "remote_patch.py", "verify", "--candidate-root", "{candidate_root}", "--revision", "{revision}", "--host", "147.182.179.38"]
cwd = ".."
timeout_seconds = 240
env = { SAS_ARENA_SSH_HOSTKEY = "SHA256:wDYo0ZCFN99EbSzVrmF0VnbhvH+ExgwGd8BNtt+8zhg" }

[hooks.deploy]
argv = ["uv", "run", "--no-sync", "python", "remote_patch.py", "deploy", "--revision", "{revision}", "--host", "147.182.179.38"]
cwd = ".."
timeout_seconds = 120
env = { SAS_ARENA_SSH_HOSTKEY = "SHA256:wDYo0ZCFN99EbSzVrmF0VnbhvH+ExgwGd8BNtt+8zhg" }

[hooks.rollback]
argv = ["uv", "run", "--no-sync", "python", "remote_patch.py", "rollback", "--host", "147.182.179.38"]
cwd = ".."
timeout_seconds = 120
env = { SAS_ARENA_SSH_HOSTKEY = "SHA256:wDYo0ZCFN99EbSzVrmF0VnbhvH+ExgwGd8BNtt+8zhg" }

[hooks.attack]
argv = ["python3", "-c", "import sys; print('no verified exploit is active', file=sys.stderr); sys.exit(2)"]
timeout_seconds = 5

[hooks.traffic]
argv = ["curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://147.182.179.38:8088/api/traffic"]
timeout_seconds = 8

[traffic]
hook = "traffic"
interval_seconds = 3
min_score = 0.7
max_detections = 50
dedupe_window_seconds = 300
deadline_seconds = 300
risk = "high"

[monitors.availability]
hook = "health"
interval_seconds = 5
failure_threshold = 2
recovery_threshold = 1
task_kind = "incident_response"
lane = "defense"
risk = "critical"
auto_rollback = true
rollback_window_seconds = 300

[monitors.checker]
hook = "checker"
interval_seconds = 30
failure_threshold = 1
recovery_threshold = 1
task_kind = "diagnose"
lane = "defense"
risk = "high"
auto_rollback = false
rollback_window_seconds = 300

[monitors.integrity]
hook = "integrity"
interval_seconds = 15
failure_threshold = 1
recovery_threshold = 1
task_kind = "incident_response"
lane = "defense"
risk = "high"
auto_rollback = true
rollback_window_seconds = 300
