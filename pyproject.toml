[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sas-agent-arena"
version = "0.1.0"
description = "Latency-aware multi-model control plane for an authorized Attack-Defense CTF replay lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.20,<2",
  "numpy>=2.1,<3",
  "openai-codex>=0.162,<0.163",
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
]

[project.scripts]
sas-arena = "sas_arena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sas_arena"]
